<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Obsidian Glass Gradient Tile -->
    <radialGradient id="luxBg" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#181a2e" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0c0e18" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="1"/>
    </radialGradient>

    <!-- Hairline Border with ambient iridescent sheen -->
    <linearGradient id="hairlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Flowing Handwriting Ink Gradient -->
    <linearGradient id="inkGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="25%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Ink Highlight Accent -->
    <linearGradient id="inkHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Ambient Ink Glow -->
    <filter id="inkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
    <filter id="deepGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Tile Backdrop (Smooth 112px radius) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#luxBg)" stroke="url(#hairlineGrad)" stroke-width="3.5"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>

  <!-- Subtle Radial Light Source behind handwriting -->
  <ellipse cx="256" cy="270" rx="160" ry="130" fill="url(#inkGrad)" opacity="0.22" filter="url(#deepGlow)"/>

  <!-- Organic Handwriting Cursive 'W' Calligraphic Paths -->
  <g filter="url(#inkGlow)">
    <!-- Base Shadow Stroke for Pen Depth on Paper -->
    <path d="M 108 196 
             C 128 152, 172 158, 184 204 
             L 208 328 
             C 214 358, 234 366, 250 348 
             L 278 226 
             C 284 196, 308 196, 316 226 
             L 344 348 
             C 358 366, 378 358, 386 328 
             L 412 186 
             C 418 154, 444 154, 452 176 
             C 456 186, 448 202, 432 208
             C 416 214, 400 206, 396 194"
          fill="none" stroke="#1e1b4b" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- Main Fluid Cursive Handwriting Stroke with Pen Width & Pressure Flow -->
    <path d="M 112 192 
             C 132 148, 172 154, 182 200 
             L 208 326 
             C 214 356, 234 364, 250 346 
             L 278 224 
             C 284 194, 308 194, 316 224 
             L 344 346 
             C 358 364, 378 356, 386 326 
             L 412 184 
             C 418 152, 444 152, 452 174 
             C 456 184, 448 200, 432 206
             C 416 212, 400 204, 396 192"
          fill="none" stroke="url(#inkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Delicate Cursive Ribbon Calligraphic Swash Inner Core (Simulating nib slit reflection) -->
    <path d="M 124 186 
             C 142 162, 170 166, 178 204 
             L 204 322 
             C 210 346, 226 352, 240 338 
             L 276 222 
             C 282 198, 302 198, 308 222 
             L 342 338 
             C 354 352, 370 346, 378 322 
             L 404 188 
             C 410 164, 434 164, 442 180"
          fill="none" stroke="url(#inkHighlight)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Authentic Wet Ink Drops / Pen Touch Dots -->
  <!-- Lead-in entry ink well -->
  <circle cx="112" cy="192" r="10" fill="url(#inkGrad)"/>
  <circle cx="112" cy="192" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- Exit flourish ink tittle -->
  <circle cx="432" cy="206" r="7" fill="#38bdf8"/>

  <!-- Ambient Micro Pen Shimmer Accents -->
  <path d="M 396 112 Q 396 130 414 130 Q 396 130 396 148 Q 396 130 378 130 Q 396 130 396 112 Z" fill="#38bdf8"/>
  <path d="M 116 364 Q 116 376 128 376 Q 116 376 116 388 Q 116 376 104 376 Q 116 376 116 364 Z" fill="#c084fc" opacity="0.8"/>
</svg>