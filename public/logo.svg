<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Light Porcelain / Ivory Gradient Backdrop -->
    <radialGradient id="lightBg" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </radialGradient>

    <!-- Hairline Border with subtle iridescent lavender-indigo tint -->
    <linearGradient id="lightBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Deep Royal Calligraphic Ink Gradient -->
    <linearGradient id="lightInk" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="25%" stop-color="#4338ca"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Specular Ink Highlight -->
    <linearGradient id="inkGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Soft Drop Shadow for Tile -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Ink Depth on Paper Filter -->
    <filter id="inkDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Tile Backdrop (Apple superellipse 112px radius) with soft lift shadow -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#lightBg)" stroke="url(#lightBorder)" stroke-width="3" filter="url(#tileShadow)"/>
  <rect x="23" y="23" width="466" height="466" rx="105" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Ambient Pearlescent Glow behind the Cursive Monogram -->
  <ellipse cx="256" cy="265" rx="150" ry="120" fill="#6366f1" opacity="0.08"/>

  <!-- Organic Fluid Cursive Handwriting 'W' Calligraphic Geometry -->
  <g filter="url(#inkDepth)">
    <!-- Main Fluid Cursive Handwriting Stroke with Pen Width & Pressure Flow -->
    <path d="M 112 192 
             C 132 148, 172 154, 182 200 
             L 208 326 
             C 214 356, 234 364, 250 346 
             L 278 224 
             C 284 194, 308 194, 316 224 
             L 344 346 
             C 358 364, 378 356, 386 326 
             L 412 184 
             C 418 152, 444 152, 452 174 
             C 456 184, 448 200, 432 206
             C 416 212, 400 204, 396 192"
          fill="none" stroke="url(#lightInk)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slender Calligraphic Ribbon Highlight -->
    <path d="M 124 186 
             C 142 162, 170 166, 178 204 
             L 204 322 
             C 210 346, 226 352, 240 338 
             L 276 222 
             C 282 198, 302 198, 308 222 
             L 342 338 
             C 354 352, 370 346, 378 322 
             L 404 188 
             C 410 164, 434 164, 442 180"
          fill="none" stroke="url(#inkGleam)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Wet Fountain Pen Ink Touchpoints -->
  <circle cx="112" cy="192" r="10" fill="url(#lightInk)"/>
  <circle cx="112" cy="192" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="432" cy="206" r="7" fill="#0284c7"/>

  <!-- Delicate Geometric Precision Sparks (AI touch) -->
  <path d="M 396 112 Q 396 128 412 128 Q 396 128 396 144 Q 396 128 380 128 Q 396 128 396 112 Z" fill="#6366f1" opacity="0.85"/>
  <path d="M 116 364 Q 116 376 128 376 Q 116 376 116 388 Q 116 376 104 376 Q 116 376 116 364 Z" fill="#7c3aed" opacity="0.75"/>
</svg>