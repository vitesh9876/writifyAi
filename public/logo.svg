<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp White Ceramic Tile Backdrop with Subtle Inset -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>

    <!-- Refined Architectural Hairline Border -->
    <linearGradient id="cleanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <!-- Deep Natural Fountain Pen Ink -->
    <linearGradient id="penInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>

    <!-- Clean Crisp Shadow (No colored glow) -->
    <filter id="cleanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Clean Rounded Square Tile (80px radius - strictly NOT a pill) -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="url(#tileBg)" stroke="url(#cleanBorder)" stroke-width="2.5" filter="url(#cleanShadow)"/>

  <!-- Fluid Authentic Handwriting Cursive 'W' Calligraphic Strokes -->
  <!-- Main Stroke -->
  <path d="M 116 196 
           C 134 152, 172 156, 184 200 
           L 208 326 
           C 214 354, 234 362, 250 344 
           L 278 224 
           C 284 196, 308 196, 316 224 
           L 344 344 
           C 358 362, 378 354, 386 326 
           L 412 184 
           C 418 154, 444 154, 452 176 
           C 456 186, 448 200, 432 206
           C 416 212, 400 204, 396 192"
        fill="none" stroke="url(#penInk)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wet Pen Nib Ink Dots -->
  <circle cx="116" cy="196" r="10" fill="#09090b"/>
  <circle cx="116" cy="196" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="432" cy="206" r="6.5" fill="#18181b"/>
</svg>